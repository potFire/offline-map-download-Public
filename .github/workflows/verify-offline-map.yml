name: Test GaoDe online and XYZ ZIP export
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-offline-map.yml'
      - 'src/**'
      - 'tests/smoke-download.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build application
        run: pnpm run build
      - name: Prepare browser test
        run: |
          npm install --prefix /tmp/offline-map-playwright --no-audit --no-fund playwright-core@1.56.1
          command -v google-chrome
      - name: Test live GaoDe tile and temporary ZIP plus mock ZIP
        shell: bash
        run: |
          set -euo pipefail
          pnpm dev --host 127.0.0.1 > /tmp/offline-map-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:5173/
          node tests/smoke-download.cjs
          if [ -f /tmp/offline-map-live-tiles.zip ]; then
            unzip -t /tmp/offline-map-live-tiles.zip
            test "$(unzip -Z1 /tmp/offline-map-live-tiles.zip | grep -Ec '^tiles/[0-9]+/[0-9]+/[0-9]+[.]png$')" -gt 0
          fi
          unzip -t /tmp/offline-map-tiles.zip
          test "$(unzip -Z1 /tmp/offline-map-tiles.zip | grep -Ec '^tiles/[0-9]+/[0-9]+/[0-9]+[.]png$')" -gt 0
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("/tmp/offline-map-gaode-check.json"))
          print("### GaoDe online test")
          if report["zipGenerated"]:
              print("Live GaoDe tile source HTTP 200; temporary XYZ ZIP downloaded and validated.")
          else:
              print("GaoDe live source could not be verified on this runner. This does not mean the local ZIP logic failed.")
              print("Reason: " + str(report.get("error") or "non-200 HTTP status/CORS issue"))
          print("Mock XYZ tile ZIP: generated and validated.")
          print("No GaoDe imagery committed to public GitHub or uploaded as an artifact.")
          PY
          rm -f /tmp/offline-map-live-tiles.zip
      - name: Save local test ZIP and network diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-map-smoke-results
          path: |
            /tmp/offline-map-gaode-check.json
            /tmp/offline-map-screenshot.png
            /tmp/offline-map-tiles.zip
            /tmp/offline-map-vite.log
          if-no-files-found: warn
